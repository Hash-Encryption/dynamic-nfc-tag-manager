<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>تسجيل دخول المدير | TapLink - شركة MUHAB</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./css/style.css">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Tajawal', 'Cairo', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#050706] text-white min-h-screen flex items-center justify-center p-4 selection:bg-emerald-500 selection:text-black">

  <!-- Background Ambient Glow -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
    <div class="absolute -top-40 -start-40 w-96 h-96 bg-emerald-600/20 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-40 -end-40 w-96 h-96 bg-green-600/10 rounded-full blur-3xl"></div>
  </div>

  <main class="w-full max-w-md bg-[#0b100d]/90 border border-emerald-500/20 backdrop-blur-xl p-8 rounded-3xl shadow-2xl relative overflow-hidden">
    
    <!-- Header Logo & Branding -->
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-gradient-to-tr from-emerald-600 to-green-500 rounded-2xl flex items-center justify-center shadow-lg shadow-emerald-500/30 mx-auto mb-4">
        <svg class="w-8 h-8 text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 004.07 7.07M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
        </svg>
      </div>
      <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 mb-2">
        <span>TapLink • شركة MUHAB</span>
      </div>
      <h1 class="text-2xl font-black text-white mb-1">لوحة تحكم بطاقات NFC</h1>
      <p class="text-neutral-400 text-xs">سجّل الدخول لإدارة الروابط الديناميكية وإحصائيات المسح السحابية</p>
    </div>

    <!-- Alert / Error message -->
    <div id="errorAlert" class="hidden mb-5 p-3.5 bg-red-500/10 border border-red-500/20 text-red-400 rounded-2xl text-xs font-medium flex items-center gap-2">
      <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      <span id="errorMessage">كلمة المرور غير صحيحة</span>
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="space-y-5">
      <div>
        <label for="password" class="block text-xs font-semibold text-neutral-300 mb-2">كلمة مرور المدير</label>
        <div class="relative">
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="أدخل كلمة المرور..." 
            required 
            autofocus
            class="w-full bg-black/60 border border-emerald-500/30 text-white placeholder-neutral-500 text-sm rounded-xl px-4 py-3 pe-11 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all"
          >
          <button 
            type="button" 
            id="togglePasswordBtn" 
            class="absolute inset-y-0 end-0 pe-3.5 flex items-center text-neutral-400 hover:text-white"
          >
            <svg id="eyeIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
          </button>
        </div>
        <p class="text-[11px] text-neutral-400 mt-2 flex items-center justify-between">
          <span>كلمة المرور الافتراضية: <code class="bg-black/60 border border-emerald-500/20 px-2 py-0.5 rounded text-emerald-400 font-mono">admin123</code></span>
        </p>
      </div>

      <button 
        type="submit" 
        id="submitBtn" 
        class="w-full py-3.5 px-4 bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-400 hover:to-green-500 active:scale-[0.98] text-black font-black rounded-xl transition-all shadow-lg shadow-emerald-500/30 text-sm flex items-center justify-center gap-2"
      >
        <span id="btnText">دخول لوحة التحكم</span>
        <svg id="btnSpinner" class="hidden w-4 h-4 animate-spin text-black" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
      </button>
    </form>

    <div class="mt-8 pt-6 border-t border-emerald-500/15 text-center">
      <a href="./" class="text-xs text-neutral-400 hover:text-emerald-400 transition-colors">
        الذهاب إلى الصفحة الرئيسية
      </a>
    </div>

  </main>

  <script>
    const form = document.getElementById('loginForm');
    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const errorAlert = document.getElementById('errorAlert');
    const errorMessage = document.getElementById('errorMessage');

    // Toggle Password Visibility
    togglePasswordBtn.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
    });

    // Check if already authenticated
    fetch('/api/auth/check')
      .then(r => r.json())
      .then(d => {
        if (d.authenticated) {
          window.location.href = '/index.html';
        }
      }).catch(() => {});

    // Form Submission
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.classList.add('hidden');
      
      btnText.textContent = 'جاري التحقق...';
      btnSpinner.classList.remove('hidden');
      submitBtn.disabled = true;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: passwordInput.value })
        });
        const data = await res.json();

        if (data.success) {
          btnText.textContent = 'تم الدخول بنجاح!';
          window.location.href = '/index.html';
        } else {
          errorMessage.textContent = data.error || 'فشل تسجيل الدخول';
          errorAlert.classList.remove('hidden');
          passwordInput.select();
        }
      } catch (err) {
        errorMessage.textContent = 'تعذر الاتصال بالخادم، يرجى المحاولة لاحقاً';
        errorAlert.classList.remove('hidden');
      } finally {
        btnText.textContent = 'دخول لوحة التحكم';
        btnSpinner.classList.add('hidden');
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
