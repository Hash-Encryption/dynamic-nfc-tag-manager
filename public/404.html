<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TapLink | جاري تحويل البطاقة الذكية... - شركة MUHAB</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Inter:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./css/style.css">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Tajawal', 'Cairo', 'Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#050706] text-white min-h-screen flex items-center justify-center p-4 selection:bg-emerald-500 selection:text-black antialiased">

  <!-- Background Ambient Glow -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
    <div class="absolute -top-40 -start-40 w-96 h-96 bg-emerald-600/15 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-40 -end-40 w-96 h-96 bg-emerald-900/20 rounded-full blur-3xl"></div>
  </div>

  <!-- Loading State (Instant sub-second visual) -->
  <div id="redirectLoadingBox" class="text-center p-6 max-w-sm w-full">
    <div class="relative w-20 h-20 mx-auto mb-4 flex items-center justify-center">
      <div class="absolute inset-0 bg-emerald-500/20 rounded-full animate-ping"></div>
      <div class="relative w-14 h-14 bg-gradient-to-tr from-emerald-600 to-emerald-400 rounded-2xl flex items-center justify-center shadow-lg shadow-emerald-500/30">
        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 004.07 7.07M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
        </svg>
      </div>
    </div>
    <div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-emerald-500/15 text-emerald-300 border border-emerald-500/30 text-[10px] font-bold mb-2">
      <span>TapLink • by MUHAB</span>
    </div>
    <h3 class="text-base font-extrabold text-white mb-1" id="loadingTitle">تم مسح الشريحة الذكية 📡</h3>
    <p class="text-xs text-emerald-400 font-mono mb-3" id="loadingSlugText">جاري التحويل للوجهة...</p>
    <div class="w-7 h-7 border-3 border-emerald-500/20 border-t-emerald-500 rounded-full animate-spin mx-auto"></div>
  </div>

  <!-- PIN Entry Screen (Mode 4: Conditional PIN) -->
  <div id="pinBox" class="hidden w-full max-w-sm bg-zinc-950/90 border border-emerald-500/20 backdrop-blur-xl p-6 sm:p-8 rounded-3xl text-center shadow-2xl">
    <div class="w-16 h-16 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-emerald-500/10">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
      </svg>
    </div>
    <span class="inline-block px-3 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-full text-xs font-semibold mb-2" id="pinBadge">
      رابط محمي برمز PIN
    </span>
    <h2 class="text-lg font-bold mb-1 text-white" id="pinCardTitle">بطاقة محمية</h2>
    <p class="text-zinc-400 text-xs mb-5" id="pinSubtitle">أدخل رمز الحماية السري للمتابعة إلى الوجهة</p>

    <div class="space-y-3">
      <input 
        type="password" 
        id="pinInput" 
        inputmode="numeric" 
        pattern="[0-9]*" 
        maxlength="8" 
        autofocus 
        placeholder="••••" 
        class="w-full text-center tracking-[0.8em] text-2xl font-mono py-2.5 bg-zinc-900 border border-zinc-700 text-white rounded-2xl focus:outline-none focus:ring-2 focus:ring-emerald-500"
      >
      <button 
        id="btnSubmitPin" 
        class="w-full py-3 bg-gradient-to-r from-emerald-600 to-emerald-500 hover:from-emerald-500 hover:to-emerald-400 active:scale-95 text-white font-bold rounded-2xl transition-all shadow-lg shadow-emerald-600/30 text-xs"
      >
        فتح الرابط السري 🔓
      </button>
    </div>
  </div>

  <!-- Unregistered / Inactive Public Safe Screen (ZERO LEAK - NO ADMIN CONTROLS) -->
  <main id="notFoundBox" class="hidden w-full max-w-sm bg-zinc-950/90 border border-emerald-500/20 backdrop-blur-2xl p-6 sm:p-8 rounded-3xl shadow-2xl text-center relative overflow-hidden">
    <div class="relative w-16 h-16 bg-gradient-to-tr from-zinc-800 to-zinc-900 border border-zinc-700/80 rounded-2xl flex items-center justify-center shadow-lg shadow-black/40 mx-auto mb-4">
      <svg class="w-8 h-8 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
      </svg>
    </div>

    <span class="inline-flex items-center gap-1.5 px-3 py-1 bg-amber-500/10 text-amber-300 border border-amber-500/20 rounded-full text-[11px] font-bold mb-3">
      <span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span>
      <span id="unregBadge">البطاقة الذكية غير مفعلة</span>
    </span>

    <h1 class="text-lg font-extrabold text-white mb-2 leading-snug" id="unregHeading">
      البطاقة الذكية غير مفعلة حالياً
    </h1>
    
    <p class="text-zinc-400 text-xs leading-relaxed mb-4" id="unregDesc">
      يرجى مراجعة مسؤول البطاقة أو نقطة الخدمة لتفعيل هذا الرابط.
    </p>

    <div class="pt-3 border-t border-zinc-800/80 flex items-center justify-center gap-2 text-[11px] text-zinc-500 font-mono">
      <span>Tag ID:</span>
      <code id="displaySlug" class="text-emerald-400/80 bg-zinc-900 border border-zinc-800 px-2 py-0.5 rounded-lg">card-xxx</code>
    </div>
  </main>

  <script>
    (function() {
      const isAr = localStorage.getItem('taplink_lang') !== 'en';
      document.documentElement.lang = isAr ? 'ar' : 'en';
      document.documentElement.dir = isAr ? 'rtl' : 'ltr';

      if (!isAr) {
        document.title = 'TapLink | Redirecting Tag... - MUHAB';
        document.getElementById('loadingTitle').textContent = 'Smart NFC Tag Scanned 📡';
        document.getElementById('loadingSlugText').textContent = 'Redirecting to destination...';
        document.getElementById('pinBadge').textContent = 'PIN Protected Tag';
        document.getElementById('pinSubtitle').textContent = 'Enter security PIN to continue to destination';
        document.getElementById('btnSubmitPin').textContent = 'Unlock Secret Link 🔓';
        document.getElementById('unregBadge').textContent = 'Tag Currently Inactive';
        document.getElementById('unregHeading').textContent = 'This Smart Tag is Currently Inactive';
        document.getElementById('unregDesc').textContent = 'Please contact the card administrator or service desk to activate this tag.';
      }

      const path = window.location.pathname;
      const pathMatch = path.match(/\/(?:c|go)\/([a-zA-Z0-9-_]+)/i);
      const urlParams = new URLSearchParams(window.location.search);
      const qSlug = urlParams.get('c') || urlParams.get('slug');
      const hash = window.location.hash || '';
      const hashMatch = hash.match(/#(?:c|go|\/c|\/go)\/([a-zA-Z0-9-_]+)/i);
      
      const slug = (pathMatch && pathMatch[1]) || qSlug || (hashMatch && hashMatch[1]);

      if (!slug) {
        // Safe fallback - no redirect to admin
        document.getElementById('redirectLoadingBox').classList.add('hidden');
        document.getElementById('notFoundBox').classList.remove('hidden');
        return;
      }

      const normalizedSlug = slug.toLowerCase();
      document.getElementById('loadingSlugText').textContent = `Tag: ${normalizedSlug}`;
      document.getElementById('displaySlug').textContent = normalizedSlug;

      // Real, pre-bundled fallback cards for sub-10ms instant offline/static redirect
      const BUNDLED_FALLBACK_CARDS = [
        {
          id: "card-ksnjv",
          title: "بطاقة تقييم جوجل الذكية",
          slug: "card-ksnjv",
          mode: "direct",
          actionType: "direct",
          destinationUrl: "https://maps.google.com",
          isActive: true
        },
        {
          id: "card-cardtest",
          title: "Google Reviews Smart Card - cardtest",
          slug: "cardtest",
          mode: "direct",
          actionType: "direct",
          destinationUrl: "https://maps.google.com",
          isActive: true
        }
      ];

      const CLOUD_DB_URL = "https://raw.githubusercontent.com/Hash-Encryption/dynamic-nfc-tag-manager/main/data/cards.json";
      const CDN_DB_URL = "https://cdn.jsdelivr.net/gh/Hash-Encryption/dynamic-nfc-tag-manager@main/data/cards.json";

      async function findAndRedirect() {
        let card = null;

        // Step 1: Check bundled cards first for instant sub-10ms redirect
        card = BUNDLED_FALLBACK_CARDS.find(c => c.slug && c.slug.toLowerCase() === normalizedSlug);
        if (card && card.isActive && card.destinationUrl) {
          executeRedirection(card);
          return;
        }

        // Step 2: Determine repository base path
        let repoBase = '';
        if (window.location.pathname.includes('/dynamic-nfc-tag-manager')) {
          repoBase = '/dynamic-nfc-tag-manager';
        }

        // Step 3: Fetch dynamic cloud updates with timeout
        try {
          const fetchWithTimeout = async (url, ms = 700) => {
            const ctrl = new AbortController();
            const tid = setTimeout(() => ctrl.abort(), ms);
            try {
              const res = await fetch(url, { signal: ctrl.signal });
              clearTimeout(tid);
              if (res.ok) return await res.json();
            } catch (e) {
              clearTimeout(tid);
            }
            return null;
          };

          const customCloudUrl = localStorage.getItem('nfc_custom_cloud_url') || '';
          const promises = [
            fetchWithTimeout(`${repoBase}/data/cards.json?_nocache=${Date.now()}`, 500),
            fetchWithTimeout(`${CLOUD_DB_URL}?_nocache=${Date.now()}`, 700),
            fetchWithTimeout(`${CDN_DB_URL}?_nocache=${Date.now()}`, 700)
          ];
          if (customCloudUrl) promises.unshift(fetchWithTimeout(customCloudUrl, 700));

          const results = await Promise.allSettled(promises);
          for (const r of results) {
            if (r.status === 'fulfilled' && Array.isArray(r.value)) {
              card = r.value.find(c => c.slug && c.slug.toLowerCase() === normalizedSlug);
              if (card) break;
            }
          }
        } catch (e) {}

        // Step 4: Check LocalStorage cache
        if (!card) {
          try {
            const raw = localStorage.getItem('nfc_cards_db');
            if (raw) {
              const list = JSON.parse(raw);
              if (Array.isArray(list)) card = list.find(c => c.slug && c.slug.toLowerCase() === normalizedSlug);
            }
          } catch (e) {}
        }

        if (card) {
          if (!card.isActive) {
            document.getElementById('redirectLoadingBox').classList.add('hidden');
            document.getElementById('notFoundBox').classList.remove('hidden');
            document.getElementById('unregHeading').textContent = isAr ? 'البطاقة متوقفة مؤقتاً' : 'Card is Temporarily Paused';
            return;
          }

          if (card.pinCode && card.pinCode.trim().length > 0) {
            document.getElementById('redirectLoadingBox').classList.add('hidden');
            document.getElementById('pinBox').classList.remove('hidden');
            document.getElementById('pinCardTitle').textContent = card.title || 'Protected Tag';

            document.getElementById('btnSubmitPin').onclick = () => {
              const pinVal = document.getElementById('pinInput').value.trim();
              if (pinVal === card.pinCode.trim()) {
                executeRedirection(card);
              } else {
                alert(isAr ? 'رمز PIN غير صحيح' : 'Incorrect PIN code');
                document.getElementById('pinInput').value = '';
              }
            };
            return;
          }

          executeRedirection(card);
          return;
        }

        // Tag is unconfigured / not registered: Show safe public screen (ZERO LEAK)
        document.getElementById('redirectLoadingBox').classList.add('hidden');
        document.getElementById('notFoundBox').classList.remove('hidden');
      }

      function executeRedirection(card) {
        let repoBase = '';
        if (window.location.pathname.includes('/dynamic-nfc-tag-manager')) {
          repoBase = '/dynamic-nfc-tag-manager';
        }

        const mode = card.mode || (card.actionType === 'profile' ? 'profile' : (card.actionType === 'catalog' ? 'catalog' : 'direct'));
        if (mode === 'profile') {
          window.location.replace(`${repoBase}/landing.html?slug=${encodeURIComponent(slug)}`);
          return;
        }
        if (mode === 'catalog') {
          window.location.replace(`${repoBase}/catalog.html?slug=${encodeURIComponent(slug)}`);
          return;
        }
        let target = (card.destinationUrl || '').trim();
        if (target) {
          window.location.replace(target);
        } else {
          window.location.replace('https://maps.google.com');
        }
      }

      findAndRedirect();
    })();
  </script>
</body>
</html>
