<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Square App Icon -->
  <rect width="512" height="512" rx="128" fill="#090d16"/>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" filter="url(#shadow)" opacity="0.95"/>
  
  <!-- NFC Radio Waves -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <!-- Center Wave -->
    <path d="M 230 180 A 100 100 0 0 1 230 332" stroke-width="26" opacity="0.95"/>
    <!-- Outer Wave -->
    <path d="M 280 140 A 160 160 0 0 1 280 372" stroke-width="26" opacity="0.8"/>
    <!-- Far Outer Wave -->
    <path d="M 330 100 A 220 220 0 0 1 330 412" stroke-width="26" opacity="0.6"/>
  </g>
  
  <!-- Smart Chip Icon -->
  <rect x="120" y="210" width="72" height="92" rx="16" fill="url(#chipGrad)"/>
  <rect x="132" y="222" width="48" height="68" rx="8" fill="none" stroke="#92400e" stroke-width="4"/>
  <line x1="120" y1="240" x2="132" y2="240" stroke="#92400e" stroke-width="4"/>
  <line x1="120" y1="272" x2="132" y2="272" stroke="#92400e" stroke-width="4"/>
  <line x1="180" y1="240" x2="192" y2="240" stroke="#92400e" stroke-width="4"/>
  <line x1="180" y1="272" x2="192" y2="272" stroke="#92400e" stroke-width="4"/>
  
  <!-- Sparkle dot -->
  <circle cx="390" cy="120" r="12" fill="#38bdf8"/>
</svg>
