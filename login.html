<!DOCTYPE html>
<html lang="en" dir="ltr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Admin Login | TapLink - MUHAB</title>
  
  <!-- Security Headers Meta Tags (Zero-Trust Hardening) -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://fonts.googleapis.com https://fonts.gstatic.com https://cdn.jsdelivr.net https://api.npoint.io https://www.npoint.io https://raw.githubusercontent.com data: blob:; img-src 'self' data: blob: https:; font-src 'self' https://fonts.gstatic.com data:;">

  <!-- Favicon & App Icons in WebP -->
  <link rel="icon" type="image/webp" href="./logo.webp">
  <link rel="apple-touch-icon" href="./logo.webp">
  <link rel="shortcut icon" href="./logo.webp">

  <!-- Open Graph & Twitter Social Metadata -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="TapLink • by MUHAB">
  <meta property="og:title" content="لوحة تحكم المدير | TapLink - شركة MUHAB">
  <meta property="og:description" content="تسجيل دخول المدير لإدارة وتحويل بطاقات NFC الذكية والروابط الديناميكية.">
  <meta property="og:image" content="./logo.webp">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="670">
  <meta property="og:image:alt" content="شعار TapLink الذكي">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="./logo.webp">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Inter:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  
  <script src="./js/i18n.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./css/style.css">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Tajawal', 'Cairo', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#050706] text-white min-h-screen flex items-center justify-center p-4 selection:bg-emerald-500 selection:text-black">

  <!-- Background Ambient Glow -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
    <div class="absolute -top-40 -start-40 w-96 h-96 bg-emerald-600/20 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-40 -end-40 w-96 h-96 bg-green-600/10 rounded-full blur-3xl"></div>
  </div>

  <main class="w-full max-w-md bg-[#0b100d]/90 border border-emerald-500/20 backdrop-blur-xl p-6 sm:p-8 rounded-3xl shadow-2xl relative overflow-hidden">
    
    <!-- Top Bar Controls -->
    <div class="flex items-center justify-between mb-4">
      <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
        <span>TapLink • by MUHAB</span>
      </div>
      <button id="btnLoginLangToggle" class="px-2.5 py-1 rounded-full bg-zinc-900 border border-emerald-500/30 text-emerald-400 hover:text-white text-xs font-bold transition-all flex items-center gap-1 active:scale-95" title="Switch Language">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"></path></svg>
        <span id="loginLangLabel">عربي</span>
      </button>
    </div>

    <!-- Header Logo & Branding with WebP -->
    <div class="text-center mb-6">
      <img 
        src="./logo.webp" 
        alt="شعار TapLink الذكي - شركة MUHAB" 
        width="180" 
        height="100" 
        class="w-40 sm:w-48 h-auto mx-auto mb-3 object-contain drop-shadow-[0_10px_25px_rgba(16,185,129,0.35)]"
        loading="eager"
      >
      <h1 class="text-xl sm:text-2xl font-black text-white mb-1" id="loginHeading">NFC Tags Control Center</h1>
      <p class="text-zinc-400 text-xs" id="loginSubtitle">Sign in to manage dynamic links, NFC chips, and real-time cloud analytics</p>
    </div>

    <!-- Alert / Error message -->
    <div id="errorAlert" class="hidden mb-5 p-3.5 bg-red-500/10 border border-red-500/20 text-red-400 rounded-2xl text-xs font-medium flex items-center gap-2">
      <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      <span id="errorMessage">Incorrect password, please try again</span>
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="space-y-4">
      <div>
        <label for="password" class="block text-xs font-semibold text-zinc-300 mb-2" id="loginPassLabel">Master Admin Password</label>
        <div class="relative">
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="Enter password..." 
            required 
            autofocus
            class="w-full bg-black/60 border border-emerald-500/30 text-white placeholder-zinc-500 text-sm rounded-xl px-4 py-3 pe-11 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all"
          >
          <button 
            type="button" 
            id="togglePasswordBtn" 
            class="absolute inset-y-0 end-0 pe-3.5 flex items-center text-zinc-400 hover:text-white"
          >
            <svg id="eyeIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
          </button>
        </div>
        <p class="text-[11px] text-zinc-400 mt-2 flex items-center justify-between">
          <span id="loginDefaultHint">Default password: <code class="bg-black/60 border border-emerald-500/20 px-2 py-0.5 rounded text-emerald-400 font-mono">admin123</code></span>
        </p>
      </div>

      <button 
        type="submit" 
        id="submitBtn"
        class="w-full bg-gradient-to-r from-emerald-600 via-emerald-500 to-green-600 hover:from-emerald-500 hover:to-green-500 active:scale-95 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-emerald-500/25 transition-all text-sm flex items-center justify-center gap-2 cursor-pointer"
      >
        <span id="btnText">Sign In to Dashboard</span>
        <div id="btnSpinner" class="hidden w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
      </button>

      <div class="text-center pt-2">
        <a href="./index.html" class="text-xs text-zinc-400 hover:text-emerald-400 transition-colors" id="loginBackHome">
          &larr; Return to Dashboard
        </a>
      </div>
    </form>

    <div class="mt-6 pt-4 border-t border-zinc-800 text-center">
      <p class="text-[11px] text-zinc-500">TapLink Smart Ecosystem &copy; 2026 • by MUHAB</p>
    </div>
  </main>

  <script>
    const form = document.getElementById('loginForm');
    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const errorAlert = document.getElementById('errorAlert');
    const errorMessage = document.getElementById('errorMessage');

    // Language Toggle
    const langBtn = document.getElementById('btnLoginLangToggle');
    const langLabel = document.getElementById('loginLangLabel');

    function updateLoginI18n() {
      const isAr = localStorage.getItem('taplink_lang') === 'ar';
      document.documentElement.lang = isAr ? 'ar' : 'en';
      document.documentElement.dir = isAr ? 'rtl' : 'ltr';
      langLabel.textContent = isAr ? 'EN' : 'عربي';

      if (isAr) {
        document.title = 'تسجيل دخول المدير | TapLink - شركة MUHAB';
        document.getElementById('loginHeading').textContent = 'لوحة تحكم بطاقات NFC';
        document.getElementById('loginSubtitle').textContent = 'سجّل الدخول لإدارة الروابط الديناميكية وإحصائيات المسح السحابية';
        document.getElementById('loginPassLabel').textContent = 'كلمة مرور المدير';
        document.getElementById('password').placeholder = 'أدخل كلمة المرور...';
        document.getElementById('loginDefaultHint').innerHTML = 'كلمة المرور الافتراضية: <code class="bg-black/60 border border-emerald-500/20 px-2 py-0.5 rounded text-emerald-400 font-mono">admin123</code>';
        btnText.textContent = 'دخول لوحة التحكم';
        document.getElementById('loginBackHome').textContent = 'الذهاب إلى لوحة التحكم &larr;';
      } else {
        document.title = 'Admin Login | TapLink - MUHAB';
        document.getElementById('loginHeading').textContent = 'NFC Tags Control Center';
        document.getElementById('loginSubtitle').textContent = 'Sign in to manage dynamic links, NFC chips, and real-time cloud analytics';
        document.getElementById('loginPassLabel').textContent = 'Master Admin Password';
        document.getElementById('password').placeholder = 'Enter password...';
        document.getElementById('loginDefaultHint').innerHTML = 'Default password: <code class="bg-black/60 border border-emerald-500/20 px-2 py-0.5 rounded text-emerald-400 font-mono">admin123</code>';
        btnText.textContent = 'Sign In to Dashboard';
        document.getElementById('loginBackHome').textContent = '&larr; Return to Dashboard';
      }
    }

    langBtn?.addEventListener('click', () => {
      const current = localStorage.getItem('taplink_lang') || 'en';
      const next = current === 'en' ? 'ar' : 'en';
      localStorage.setItem('taplink_lang', next);
      updateLoginI18n();
    });

    updateLoginI18n();

    // Toggle Password Visibility
    togglePasswordBtn?.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
    });

    // Check if already authenticated
    fetch('/api/auth/check')
      .then(r => r.json())
      .then(d => {
        if (d.authenticated) {
          window.location.href = './index.html';
        }
      }).catch(() => {});

    const ADMIN_SALT = '::taplink_salt_2026';
    const DEFAULT_ADMIN_HASH = 'b07f0885c6810f7e2dadc1e0b86e82f4f7b5b946c1439f00046912ec72633d91';

    async function hashPassword(plainText) {
      try {
        if (!plainText || typeof plainText !== 'string') return '';
        const enc = new TextEncoder();
        const data = enc.encode(plainText + ADMIN_SALT);
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
      } catch (e) {
        return '';
      }
    }

    // Form Submission with Anti-Brute-Force & Server Priority
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.classList.add('hidden');
      
      const isAr = localStorage.getItem('taplink_lang') === 'ar';
      btnText.textContent = isAr ? 'جاري التحقق...' : 'Verifying...';
      btnSpinner.classList.remove('hidden');
      submitBtn.disabled = true;

      const entered = passwordInput.value.trim();

      // 1. Prioritize Server-side Authentication (Hardened with Rate-Limiting & Cryptographic check)
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: entered })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          localStorage.setItem('nfc_admin_auth', 'authenticated');
          btnText.textContent = isAr ? 'تم الدخول بنجاح!' : 'Login successful!';
          setTimeout(() => {
            window.location.href = './index.html';
          }, 200);
          return;
        } else {
          // Explicit error from server (wrong password or rate-limited 429)
          errorMessage.textContent = isAr ? (data.error || 'كلمة المرور غير صحيحة') : (data.errorEn || data.error || 'Incorrect password, please try again');
          errorAlert.classList.remove('hidden');
          passwordInput.select();
          return;
        }
      } catch (networkErr) {
        // 2. Offline / Static host fallback (e.g., GitHub Pages without Node server)
        const enteredHash = await hashPassword(entered);
        const savedHash = localStorage.getItem('nfc_admin_pass_hash') || DEFAULT_ADMIN_HASH;

        if (enteredHash === savedHash) {
          localStorage.setItem('nfc_admin_auth', 'authenticated');
          btnText.textContent = isAr ? 'تم الدخول بنجاح!' : 'Login successful!';
          setTimeout(() => {
            window.location.href = './index.html';
          }, 200);
          return;
        } else {
          errorMessage.textContent = isAr ? 'كلمة المرور غير صحيحة، حاول مجدداً' : 'Incorrect password, please try again';
          errorAlert.classList.remove('hidden');
          passwordInput.select();
        }
      } finally {
        btnText.textContent = isAr ? 'دخول لوحة التحكم' : 'Sign In to Dashboard';
        btnSpinner.classList.add('hidden');
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
