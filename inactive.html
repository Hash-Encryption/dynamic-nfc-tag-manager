<!DOCTYPE html>
<html lang="en" dir="ltr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Tag Currently Paused | TapLink - MUHAB</title>
  
  <!-- Security Headers Meta Tags (Zero-Trust Hardening) -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://fonts.googleapis.com https://fonts.gstatic.com https://cdn.jsdelivr.net https://api.npoint.io https://www.npoint.io https://raw.githubusercontent.com data: blob:;">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Inter:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./css/style.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Tajawal', 'Cairo', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#050706] text-zinc-100 min-h-screen flex items-center justify-center p-4 selection:bg-amber-500 selection:text-white">

  <!-- Ambient Glow -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
    <div class="absolute -top-40 -start-40 w-96 h-96 bg-amber-500/15 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-40 -end-40 w-96 h-96 bg-orange-600/15 rounded-full blur-3xl"></div>
  </div>

  <main class="w-full max-w-md bg-zinc-950/85 border border-zinc-800 backdrop-blur-xl p-8 rounded-3xl shadow-2xl text-center relative overflow-hidden">
    
    <!-- Top Bar with Language Toggle -->
    <div class="flex items-center justify-between mb-4">
      <span class="inline-flex items-center gap-1.5 px-3 py-1 bg-amber-500/10 text-amber-400 border border-amber-500/20 rounded-full text-xs font-semibold" id="inactiveStatusBadge">
        <span class="w-2 h-2 rounded-full bg-amber-400"></span>
        <span>Tag Status: Inactive</span>
      </span>
      <button id="btnInactiveLang" class="px-2.5 py-1 rounded-full bg-zinc-900 border border-amber-500/20 text-amber-400 hover:text-white text-xs font-bold transition-all flex items-center gap-1 active:scale-95" title="Switch Language">
        <span id="inactiveLangText">عربي</span>
      </button>
    </div>

    <!-- Pause / Inactive Icon -->
    <div class="relative w-24 h-24 mx-auto mb-6 flex items-center justify-center">
      <div class="absolute inset-0 bg-amber-500/20 rounded-full nfc-wave-1"></div>
      <div class="relative w-16 h-16 bg-gradient-to-tr from-amber-600 to-amber-400 rounded-2xl flex items-center justify-center shadow-lg shadow-amber-500/30">
        <svg class="w-8 h-8 text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
      </div>
    </div>

    <h1 class="text-2xl font-bold mb-3 text-white" id="inactiveHeading">This NFC Tag is Currently Paused</h1>
    
    <p class="text-zinc-400 text-sm leading-relaxed mb-6" id="inactiveDesc">
      This link has been temporarily disabled by its owner. Redirection is currently unavailable.
    </p>

    <!-- Actions -->
    <div class="space-y-3">
      <button onclick="window.location.reload()" class="w-full py-3 px-4 bg-zinc-900 hover:bg-zinc-850 active:scale-[0.98] text-white font-medium rounded-xl transition-all border border-zinc-700 flex items-center justify-center gap-2 text-xs">
        <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        <span id="inactiveBtnRetry">إعادة المحاولة والتحديث • Retry</span>
      </button>
    </div>

    <p class="text-[11px] text-zinc-500 mt-6">
      TapLink Smart NFC Ecosystem &copy; 2026 • by MUHAB
    </p>
  </main>

  <script>
    let currentInactiveLang = localStorage.getItem('taplink_lang') || 'en';
    function updateInactiveLanguage(lang) {
      currentInactiveLang = lang;
      localStorage.setItem('taplink_lang', lang);
      const isAr = (lang === 'ar');
      document.documentElement.lang = lang;
      document.documentElement.dir = isAr ? 'rtl' : 'ltr';

      const langBtnText = document.getElementById('inactiveLangText');
      if (langBtnText) langBtnText.textContent = isAr ? 'EN' : 'عربي';

      document.title = isAr ? 'البطاقة متوقفة حالياً | TapLink' : 'Tag Currently Paused | TapLink - MUHAB';
      document.getElementById('inactiveHeading').textContent = isAr ? 'هذه البطاقة متوقفة حالياً' : 'This NFC Tag is Currently Paused';
      document.getElementById('inactiveDesc').textContent = isAr ? 'تم إيقاف تفعيل هذا الرابط مؤقتاً من قبل صاحب البطاقة. لا يمكن تحويلك أو عرض البيانات في الوقت الحالي.' : 'This link has been temporarily disabled by its owner. Redirection is currently unavailable.';
      document.getElementById('inactiveOwnerQ').textContent = isAr ? 'هل أنت صاحب هذه البطاقة؟' : 'Are you the owner of this card?';
      document.getElementById('inactiveOwnerHint').textContent = isAr ? 'يمكنك إعادة تفعيل البطاقة فوراً من لوحة التحكم بالضغط على زر "تفعيل".' : 'You can reactivate this card anytime from the admin dashboard by clicking "Activate".';
      document.getElementById('inactiveBtnRetry').textContent = isAr ? 'إعادة المحاولة والتحديث' : 'Retry & Refresh';
      document.getElementById('inactiveBtnLogin').textContent = isAr ? 'تسجيل الدخول للوحة التحكم' : 'Login to Admin Dashboard';
      document.getElementById('inactiveStatusBadge').querySelector('span:last-child').textContent = isAr ? 'حالة الشريحة: غير نشطة' : 'Tag Status: Inactive';
    }

    document.getElementById('btnInactiveLang')?.addEventListener('click', () => {
      updateInactiveLanguage(currentInactiveLang === 'en' ? 'ar' : 'en');
    });

    updateInactiveLanguage(currentInactiveLang);
  </script>
</body>
</html>
